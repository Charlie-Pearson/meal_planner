<!-- Modal for adding new ingredients -->
<div class="modal fade" id="ingredientModal" tabindex="-1" aria-labelledby="ingredientModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="ingredientModalLabel">Add New Ingredient</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form id="addIngredientForm" method="POST" action="{{ url_for('manage_ingredients', action='add') }}">
                <div class="modal-body">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label for="ingredientName" class="form-label">Ingredient Name</label>
                        <input type="text" class="form-control" id="ingredientName" name="name" required>
                        <div class="invalid-feedback">Please provide an ingredient name.</div>
                    </div>
                    <div class="mb-3">
                        <label for="ingredientUnit" class="form-label">Unit</label>
                        <input type="text" class="form-control" id="ingredientUnit" name="unit" required>
                        <div class="invalid-feedback">Please provide a unit (e.g., g, ml, cups).</div>
                    </div>
                    <div class="mb-3">
                        <label for="ingredientAisle" class="form-label">Aisle</label>
                        <input type="text" class="form-control" id="ingredientAisle" name="aisle" list="aisle-suggestions" required>
                        <datalist id="aisle-suggestions">
                            {% for aisle in distinct_aisles %}
                            <option value="{{ aisle }}">
                            {% endfor %}
                        </datalist>
                        <div class="invalid-feedback">Please select or enter an aisle.</div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">Add Ingredient</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    // Handle form submission for adding new ingredients
    const addIngredientForm = document.getElementById('addIngredientForm');
    if (addIngredientForm) {
        addIngredientForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formData = new FormData(this);
            
            try {
                const response = await fetch(this.action, {
                    method: 'POST',
                    body: formData,
                    headers: {
                        'X-Requested-With': 'XMLHttpRequest',
                        'Accept': 'application/json',
                    }
                });
                
                const data = await response.json();
                
                if (response.ok) {

                    console.log("Ingrident added");

                    // Close the modal and refresh the ingredient list
                    const modal = bootstrap.Modal.getInstance(document.getElementById('ingredientModal'));
                    modal.hide();
                    
                    // Show success message
                    showToast('Ingredient added successfully!');

                    
                    // Reset the form
                    this.reset();
                    
                    // Reload the page to update the ingredient list
                    window.location.reload();
                } else {

                    console.log("Ingrident not added");


                    // Show error message
                    showToast(data.error || 'Failed to add ingredient', 'danger');
                }
            } catch (error) {
                console.error('Error:', error);
                showToast('An error occurred while adding the ingredient', 'danger');
            }
        });
    }
    
    // Show toast notification
    function showToast(message, type = 'success') {
        const toastContainer = document.getElementById('toastContainer');
        if (!toastContainer) return;
        
        const toast = document.createElement('div');
        toast.className = `toast align-items-center text-white bg-${type} border-0`;
        toast.setAttribute('role', 'alert');
        toast.setAttribute('aria-live', 'assertive');
        toast.setAttribute('aria-atomic', 'true');
        toast.innerHTML = `
            <div class="d-flex">
                <div class="toast-body">
                    ${message}
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        `;
        
        toastContainer.appendChild(toast);
        const bsToast = new bootstrap.Toast(toast);
        bsToast.show();
        
        // Remove toast after it's hidden
        toast.addEventListener('hidden.bs.toast', function() {
            toast.remove();
        });
    }
});
</script>
