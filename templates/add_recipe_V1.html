<!-- meal_planner/templates/add_recipe.html -->
{% extends 'base.html' %}

{% block title %}Add New Recipe{% endblock %}

{% block content %}
<div class="modal fade flashing-modal" id="ingredientModalEdit" tabindex="-1" aria-labelledby="ingredientModalLabelEdit" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="newIngredientModalLabelEdit">Add New Ingredient</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label for="new-ingredient-name" class="form-label">Ingredient Name</label>
            <input type="text" class="form-control" id="new-ingredient-name" required>
          </div>
          <div class="mb-3">
            <label for="new-ingredient-unit" class="form-label">Unit Type</label>
            <input type="text" class="form-control" id="new-ingredient-unit" required>
          </div>
          <div class="mb-3">
            <label for="new-ingredient-aisle" class="form-label">Aisle</label>
            <input type="text" class="form-control" id="new-ingredient-aisle" list="aisle-suggestions" required>
            <datalist id="aisle-suggestions">
              {% for aisle in distinct_aisles %}
                <option value="{{ aisle }}">
              {% endfor %}
            </datalist>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary" id="save-new-ingredient">Save Ingredient</button>
        </div>
      </div>
    </div>
  </div>
<div class="container py-4">
    <h2 class="page-title h3 mb-4">Add New Recipe</h2>

    <div class="card">
        <div class="card-body">
            <form method="POST" action="{{ url_for('add_recipe') }}" id="recipe-form" class="needs-validation" novalidate>
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="row g-4">
                    <!-- Recipe Name -->
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="name" class="form-label">Recipe Name</label>
                            <input type="text" class="form-control" id="name" name="name" required 
                                value="{{ request.form.get('name', '') }}"
                                placeholder="Enter recipe name">
                        </div>
                    </div>

                    <!-- Source Link -->
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="source_link" class="form-label">Source Link (Optional)</label>
                            <input type="url" class="form-control" id="source_link" name="source_link" 
                                value="{{ request.form.get('source_link', '') }}"
                                placeholder="https://...">
                        </div>
                    </div>

                    <!-- Servings -->
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="servings" class="form-label">Servings</label>
                            <input type="number" class="form-control" id="servings" name="servings" 
                                required min="1" value="{{ request.form.get('servings', '') }}"
                                placeholder="Number of people">
                        </div>
                    </div>

                    <!-- Meal Types -->
                    <div class="col-md-6">
                        <label class="form-label d-block">Meal Type(s)</label>
                        <div class="form-check form-check-inline">
                            <input type="checkbox" class="form-check-input" id="is_breakfast" name="is_breakfast" 
                                value="1" {% if request.form.get('is_breakfast') %}checked{% endif %}>
                            <label class="form-check-label" for="is_breakfast">Breakfast</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input type="checkbox" class="form-check-input" id="is_lunch" name="is_lunch" 
                                value="1" {% if request.form.get('is_lunch') %}checked{% endif %}>
                            <label class="form-check-label" for="is_lunch">Lunch</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input type="checkbox" class="form-check-input" id="is_dinner" name="is_dinner" 
                                value="1" {% if request.form.get('is_dinner') %}checked{% endif %}>
                            <label class="form-check-label" for="is_dinner">Dinner</label>
                        </div>
                    </div>

                    <!-- Ingredients -->
                    <div class="mb-3">
                        <label class="form-label">Ingredients</label>
                        <div id="ingredients-list">
                            <!-- Ingredient rows will be added here dynamically -->
                        </div>
                        <div class="mt-2">
                            <button type="button" class="btn btn-outline-primary me-2" id="add-ingredient-btn">
                                <i class="fas fa-plus"></i> Add Ingredient
                            </button>
                            <button type="button" class="btn btn-outline-secondary" id="new-ingredient-btn-edit">
                                <i class="fas fa-plus"></i> New Ingredient
                            </button>
                        </div>
                    </div>
                    </div>


                    <!-- Method -->
                    <div class="col-12">
                        <div class="form-group">
                            <label for="method" class="form-label">Method (Optional)</label>
                            <textarea class="form-control" id="method" name="method" 
                                rows="8" placeholder="Enter cooking instructions...">{{ request.form.get('method', '') }}</textarea>
                        </div>
                    </div>

                    <!-- Submit Button -->
                    <div class="col-12">
                        <div class="d-flex justify-content-end">
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-plus-circle me-2"></i>Add Recipe
                            </button>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>

{% block scripts_extra %}
<script id="ingredients-data" type="application/json">
{
  "ingredients": {{ ingredients_data|default([])|tojson|safe }},
  "aisles": {{ distinct_aisles|default([])|tojson|safe }}
}
</script>
<script>
// Initialize with empty arrays
window.ingredientsData = [];
window.distinctAisles = [];
window.formIngredients = [];

// Get data from JSON script tag
try {
    const dataElement = document.getElementById('ingredients-data');
    if (dataElement) {
        const data = JSON.parse(dataElement.textContent);
        
        if (Array.isArray(data.ingredients)) {
            window.ingredientsData = data.ingredients;
            console.log('Ingredients data loaded:', window.ingredientsData);
        } else {
            console.warn('Invalid ingredients data format:', data.ingredients);
        }
        
        if (Array.isArray(data.aisles)) {
            window.distinctAisles = data.aisles;
            console.log('Distinct aisles loaded:', window.distinctAisles);
        } else {
            console.warn('Invalid aisles data format:', data.aisles);
        }
    } else {
        console.error('Could not find ingredients data element');
    }
} catch (e) {
    console.error('Error parsing ingredients data:', e);
}

// For backward compatibility
window.allIngredients = Array.isArray(window.ingredientsData) ? window.ingredientsData : [];

console.log('Final ingredients data:', window.ingredientsData);
console.log('Final distinct aisles:', window.distinctAisles);
    
    // Function to initialize the recipe form
    function initRecipeForm() {
        console.log('Initializing recipe form with data:', {
            ingredientsData: window.ingredientsData,
            distinctAisles: window.distinctAisles,
            hasFunction: typeof initializeRecipeForm === 'function'
        });
        
        // Initialize the recipe form
        if (typeof initializeRecipeForm === 'function') {
            initializeRecipeForm(window.ingredientsData, window.distinctAisles);
            
            // Check if there are no existing ingredient rows before adding one
            if ($('.ingredient-row').length === 0) {
                addIngredientRow();
                console.log('Added initial ingredient row');
            } else {
                console.log('Using existing ingredient rows');
            }
            console.log('Recipe form initialized successfully');
        } else {
            console.error('initializeRecipeForm function not found');
            // Load the recipe_form.js script if not already loaded
            var script = document.createElement('script');
            script.src = "{{ url_for('static', filename='js/recipe_form.js') }}";
            script.onload = function() {
                console.log('recipe_form.js loaded successfully');
                if (typeof initializeRecipeForm === 'function') {
                    initializeRecipeForm(window.ingredientsData, window.distinctAisles);
                    addIngredientRow();
                } else {
                    console.error('initializeRecipeForm still not found after loading recipe_form.js');
                }
            };
            script.onerror = function() {
                console.error('Failed to load recipe_form.js');
            };
            document.body.appendChild(script);
        }
    }
    
    // Start the initialization when the document is ready
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', function() {
            initRecipeForm();
            // Form validation
            (function () {
                'use strict'
                var forms = document.querySelectorAll('.needs-validation')
                Array.prototype.slice.call(forms).forEach(function (form) {
                    form.addEventListener('submit', function (event) {
                        if (!form.checkValidity()) {
                            event.preventDefault()
                            event.stopPropagation()
                        }
                        form.classList.add('was-validated')
                    }, false)
                })
            })();
        });
    } else {
        // DOM is already ready
        initRecipeForm();
        // Form validation
        (function () {
            'use strict'
            var forms = document.querySelectorAll('.needs-validation')
            Array.prototype.slice.call(forms).forEach(function (form) {
                form.addEventListener('submit', function (event) {
                    if (!form.checkValidity()) {
                        event.preventDefault()
                        event.stopPropagation()
                    }
                    form.classList.add('was-validated')
                }, false)
            })
        })();
    }
    
    // Log when all scripts are loaded
    console.log('All scripts loaded, starting form initialization...');
</script>

<style>
    .form-group {
        margin-bottom: 1rem;
    }

    .form-control {
        background-color: #fff;
        border: 1px solid #E2E8F0;
        transition: all 0.3s ease;
    }

    .form-control:focus {
        border-color: var(--brand-primary);
        box-shadow: 0 0 0 3px rgba(14,138,62,0.1);
    }

    textarea.form-control {
        min-height: 120px;
        line-height: 1.6;
    }

    .ingredient-format {
        font-size: 0.9rem;
        border-radius: 8px;
    }

    .form-check-input:checked {
        background-color: var(--brand-primary);
        border-color: var(--brand-primary);
    }

    .form-check-input:focus {
        border-color: var(--brand-primary);
        box-shadow: 0 0 0 3px rgba(14,138,62,0.1);
    }

    .btn-primary {
        padding: 0.75rem 1.5rem;
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }
</style>
{% endblock %}

{% endblock %}
